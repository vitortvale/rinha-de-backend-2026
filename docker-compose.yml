services:
  api1:
    image: vitortvale/rinha-2026-ocaml:39301ba
    pull_policy: always
    ports:
      - "9999:9999"
    environment:
      TCP_PORT: "9999"
      DATA_DIR: /app/data
      IVF_FAST_NPROBE: "4"
      IVF_NPROBE: "24"
    deploy:
      resources:
        limits:
          cpus: "0.99"
          memory: "318MB"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  api2:
    image: vitortvale/rinha-2026-ocaml:39301ba
    pull_policy: always
    environment:
      TCP_PORT: "9998"
      DATA_DIR: /app/data
      IVF_FAST_NPROBE: "4"
      IVF_NPROBE: "24"
    deploy:
      resources:
        limits:
          cpus: "0.01"
          memory: "32MB"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
