services:
  haproxy:
    image: haproxy:2.9-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,Z
      - sockets:/sockets
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "16MB"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  api1:
    build: .
    environment:
      SOCKET_PATH: "/sockets/api1.sock"
      DATA_DIR: "/app/data"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "167MB"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: [ "CMD", "/app/rinha_healthcheck" ]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 1s

  api2:
    build: .
    environment:
      SOCKET_PATH: "/sockets/api2.sock"
      DATA_DIR: "/app/data"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "167MB"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: [ "CMD", "/app/rinha_healthcheck" ]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 1s

volumes:
  sockets:
