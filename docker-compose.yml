services:
  lb:
    image: vitortvale/rinha-2026-ocaml-lb:58b2693
    pull_policy: always
    command: ["/app/rinha_lb"]
    environment:
      PORT: "9999"
      UPSTREAMS: "/sockets/api1.fd.sock,/sockets/api2.fd.sock"
      LB_WORKERS: "32"
      OCAMLRUNPARAM: "s=2M,o=120"
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "32MB"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  api1: &api
    image: vitortvale/rinha-2026-ocaml:58b2693
    pull_policy: always
    hostname: api1
    environment:
      SOCKET_PATH: /sockets/api1.sock
      FD_SOCKET_PATH: /sockets/api1.fd.sock
      DATA_DIR: /app/data
      API_WORKERS: "2"
      IVF_FAST_NPROBE: "3"
      IVF_NPROBE: "48"
      OCAMLRUNPARAM: "s=8M,o=300"
    volumes:
      - sockets:/sockets
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "159MB"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: [ "CMD", "/app/rinha_healthcheck" ]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 1s

  api2:
    <<: *api
    hostname: api2
    environment:
      SOCKET_PATH: /sockets/api2.sock
      FD_SOCKET_PATH: /sockets/api2.fd.sock
      DATA_DIR: /app/data
      API_WORKERS: "2"
      IVF_FAST_NPROBE: "3"
      IVF_NPROBE: "48"
      OCAMLRUNPARAM: "s=8M,o=300"

networks:
  rinha:
    driver: bridge

volumes:
  sockets:
