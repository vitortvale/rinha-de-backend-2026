global
  maxconn 32000
  nbthread 1
  tune.bufsize 8192

defaults
  mode http
  timeout connect 2s
  timeout http-request 2s
  timeout http-keep-alive 10s
  timeout client 30s
  timeout server 30s
  option http-keep-alive
  option tcp-smart-accept
  option tcp-smart-connect

frontend http
  bind *:9999
  default_backend api

backend api
  balance roundrobin
  http-reuse always
  server api1 /sockets/api1.sock maxconn 10000
  server api2 /sockets/api2.sock maxconn 10000
